<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7ef">
  <meta name="description" content="A private, offline recovery companion for daily reflection, prayer and Twelve Step resources.">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-title" content="Daymark">
  <link rel="icon" href="./assets/icons/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
  <script src="./js/theme.js"></script>
  <script type="module" src="./js/app.js"></script>
  <title>Daymark by StepOneArt</title>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="sidebar" class="sidebar"></div>
  <div class="workspace">
    <header class="topbar" id="topbar"></header>
    <aside aria-label="App notices" aria-live="polite" id="notices" class="notices" hidden></aside>
    <main tabindex="-1" id="main" aria-busy="true">
      <h1>Daymark</h1>
      <p>Opening your recovery companion…</p>
      <noscript><p>Enable JavaScript in your browser to use Daymark.</p></noscript>
    </main>
    <footer id="footer" class="footer"></footer>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Main navigation"></nav>
  <div id="status" class="sr-only" role="status"></div>
  <div id="toast" class="toast" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
